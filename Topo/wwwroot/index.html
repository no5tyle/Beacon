<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Beacon</title>
    <link rel="icon" type="image/png" href="favicon-32.png">
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="Topo.styles.css" rel="stylesheet" />
    <script>
        // Beacon and Beacon Reference install as two separate apps: the reference/ address gets the Reference app's
        // name, icon and offline support, and every other address gets Beacon's own
        (function () {
            var base = new URL(document.baseURI).pathname;
            function add(tag, attributes) {
                var element = document.createElement(tag);
                for (var name in attributes)
                    element.setAttribute(name, attributes[name]);
                document.head.appendChild(element);
            }
            if (!location.pathname.startsWith(base + "reference")) {
                add("link", { rel: "manifest", href: "manifest.webmanifest" });
                add("link", { rel: "apple-touch-icon", href: "apple-touch-icon.png" });
                add("meta", { name: "apple-mobile-web-app-title", content: "Beacon" });
                add("meta", { name: "apple-mobile-web-app-capable", content: "yes" });
                add("meta", { name: "mobile-web-app-capable", content: "yes" });
                add("meta", { name: "theme-color", content: "#052767" });
                add("link", { rel: "stylesheet", href: "css/dark.css" });
                if ("serviceWorker" in navigator)
                    navigator.serviceWorker.register(new URL("service-worker.js", document.baseURI), { scope: base });
                return;
            }
            document.title = "Beacon Reference";
            add("link", { rel: "manifest", href: "reference/manifest.webmanifest" });
            add("link", { rel: "apple-touch-icon", href: "reference/apple-touch-icon.png" });
            add("meta", { name: "apple-mobile-web-app-title", content: "Beacon Reference" });
            add("meta", { name: "apple-mobile-web-app-capable", content: "yes" });
            add("meta", { name: "mobile-web-app-capable", content: "yes" });
            add("meta", { name: "theme-color", content: "#052767" });
            add("link", { rel: "stylesheet", href: "reference/dark.css" });
            window.topoReferenceApp = true;
            // Blazor loads a few hundred files; keep a record of them all so "Save everything for offline" can find them
            if (performance.setResourceTimingBufferSize)
                performance.setResourceTimingBufferSize(2000);
            if ("serviceWorker" in navigator)
                navigator.serviceWorker.register(new URL("reference/service-worker.js", document.baseURI));
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="mt-3 mb-3 row text-center">
            <p />
            <h2>Beacon, lighting the way through the Terrain</h2>
            <p />
            <p />
            <h4>Please wait while Beacon loads</h4>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
<script type="text/javascript">
    // Use it for .NET 6+
    function BlazorDownloadFile(filename, contentType, content) {
        // Create the URL
        const file = new File([content], filename, { type: contentType });
        const exportUrl = URL.createObjectURL(file);

        // Create the <a> element and click on it
        const a = document.createElement("a");
        document.body.appendChild(a);
        a.href = exportUrl;
        a.download = filename;
        a.target = "_self";
        a.click();

        // We don't need to keep the object URL, let's release the memory
        // On older versions of Safari, it seems you need to comment this line...
        URL.revokeObjectURL(exportUrl);
    }

    // Share through the phone's share sheet, or copy where sharing isn't available. Returns "shared", "copied", "cancelled" or "failed"
    async function topoShare(title, text, url) {
        if (navigator.share) {
            try {
                await navigator.share(url ? { title: title, text: text, url: url } : { title: title, text: text });
                return "shared";
            } catch (e) {
                if (e && e.name === "AbortError")
                    return "cancelled";
            }
        }
        return await copyText(url ? text + "\n" + url : text) ? "copied" : "failed";
    }

    // Keep the address bar in step with the reference filters without reloading
    function topoReplaceQuery(query) {
        history.replaceState(history.state, "", location.pathname + query);
    }

    function topoScrollTo(id) {
        var element = document.getElementById(id);
        if (element)
            element.scrollIntoView({ block: "center" });
    }

    function topoPrint() {
        window.print();
    }

    function topoConfirm(message) {
        return window.confirm(message);
    }

    // True when the Beacon Reference service worker is in control, so fetched files are kept for offline use
    function topoOfflineSupported() {
        return !!(navigator.serviceWorker && navigator.serviceWorker.controller);
    }

    // Tell .NET whenever the device goes offline or comes back online. Returns whether it is online now
    function topoWatchOnline(dotNet) {
        function notify() {
            dotNet.invokeMethodAsync("OnlineChanged", navigator.onLine);
        }
        window.addEventListener("online", notify);
        window.addEventListener("offline", notify);
        return navigator.onLine;
    }

    // Fetch the app's own files and the given template addresses through the service worker so it keeps a copy.
    // Returns how many of them are now saved
    async function topoSaveForOffline(urls) {
        var page = new URL("reference/", document.baseURI).href;
        var shell = performance.getEntriesByType("resource")
            .map(function (entry) { return entry.name; })
            .filter(function (name) { return name.startsWith(location.origin); });
        var all = Array.from(new Set([page].concat(shell, urls)));
        for (var i = 0; i < all.length; i += 8) {
            await Promise.all(all.slice(i, i + 8).map(function (url) {
                return fetch(url).catch(function () { });
            }));
        }
        var saved = 0;
        for (var j = 0; j < urls.length; j++) {
            if (await caches.match(urls[j], { ignoreSearch: true }))
                saved++;
        }
        return saved;
    }

    // Home Screen install: whether this copy is the installed app, and the browser's own install prompt where
    // it offers one (Chrome and Edge; Safari has none, so iPhones get instructions instead)
    var beaconInstallPrompt = null;
    var beaconInstallWatchers = [];
    window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        beaconInstallPrompt = e;
        beaconInstallWatchers.forEach(function (w) { w.invokeMethodAsync("InstallStateChanged"); });
    });
    window.addEventListener("appinstalled", function () {
        beaconInstallPrompt = null;
        try { localStorage.setItem("beacon-installed", "true"); } catch (e) { }
        beaconInstallWatchers.forEach(function (w) { w.invokeMethodAsync("InstallStateChanged"); });
    });

    function beaconIsInstalledApp() {
        return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    }

    // "installed" when running from the Home Screen (or just installed from this tab), "prompt" when the browser
    // can install it with one tap, "ios" when it needs Share > Add to Home Screen, otherwise "none"
    function beaconInstallState(dotNet) {
        if (dotNet && beaconInstallWatchers.indexOf(dotNet) < 0)
            beaconInstallWatchers.push(dotNet);
        var justInstalled = false;
        try { justInstalled = localStorage.getItem("beacon-installed") === "true"; } catch (e) { }
        if (beaconIsInstalledApp() || (justInstalled && !beaconInstallPrompt))
            return "installed";
        if (beaconInstallPrompt)
            return "prompt";
        var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        return ios ? "ios" : "none";
    }

    function beaconStopInstallWatch(dotNet) {
        beaconInstallWatchers = beaconInstallWatchers.filter(function (w) { return w !== dotNet; });
    }

    // Shows the browser's install prompt. Returns "accepted", "dismissed" or "unavailable"
    async function beaconInstall() {
        if (!beaconInstallPrompt)
            return "unavailable";
        var prompt = beaconInstallPrompt;
        beaconInstallPrompt = null;
        prompt.prompt();
        var choice = await prompt.userChoice;
        return choice.outcome;
    }

    // Login page: focus the first empty field, and log in straight away when a password manager fills the
    // member number and password. A fill is spotted by the browser marking the field :autofill (Safari and
    // Chrome both do), or by the password arriving several characters at once rather than one keystroke at
    // a time; the fields are also checked on a timer in case the fill fires no events. Only tries once per
    // visit, so a failed login doesn't loop. iOS only shows the keyboard for a tap, so there the focus does
    // nothing. Tapping the version line shows what happened (event names and lengths, never the values).
    function beaconLoginPage() {
        var branch = document.getElementById("branch");
        var member = document.getElementById("memberNumber");
        var password = document.getElementById("password");
        var button = document.getElementById("logIn");
        if (!branch || !member || !password || !button)
            return;

        var log = [];
        function note(text) {
            log.push(((performance.now() / 1000).toFixed(2)) + "s " + text);
            if (log.length > 40)
                log.shift();
            var shown = document.getElementById("loginDiagnostics");
            if (shown)
                shown.textContent = log.join("\n");
        }
        var version = document.querySelector(".login-version");
        if (version) {
            version.addEventListener("click", function () {
                var shown = document.getElementById("loginDiagnostics");
                if (shown) {
                    shown.remove();
                    return;
                }
                shown = document.createElement("pre");
                shown.id = "loginDiagnostics";
                shown.className = "login-diagnostics";
                shown.textContent = log.join("\n");
                version.before(shown);
            });
        }

        var firstEmpty = [branch, member, password].find(function (field) { return !field.value; });
        if (firstEmpty)
            firstEmpty.focus();

        function autofilled(field) {
            for (var selector of [":autofill", ":-webkit-autofill"]) {
                try {
                    if (field.matches(selector))
                        return true;
                } catch (e) {
                    // Selector not supported by this browser
                }
            }
            return false;
        }

        // Length of the password the last time it changed by a keystroke; a jump of several characters is a fill
        var lastLength = 0;
        var jumped = false;
        function sawPassword(source) {
            var length = password.value.length;
            if (length - lastLength >= 3)
                jumped = true;
            if (length < lastLength || length - lastLength === 1)
                jumped = false;
            if (length !== lastLength)
                note(source + " password " + lastLength + "\u2192" + length + (autofilled(password) ? " autofill" : ""));
            lastLength = length;
        }

        var tried = false;
        var watch;
        function loginIfFilled(source) {
            if (tried || !document.body.contains(button)) {
                clearInterval(watch);
                return;
            }
            sawPassword(source);
            if (!branch.value || !member.value || !password.value)
                return;
            if (!jumped && !autofilled(password))
                return;
            tried = true;
            clearInterval(watch);
            note("logging in (" + (autofilled(password) ? "autofill" : "filled at once") + ")");
            // Make sure Blazor has the filled values before logging in
            member.dispatchEvent(new Event("change", { bubbles: true }));
            password.dispatchEvent(new Event("change", { bubbles: true }));
            setTimeout(function () { button.click(); }, 50);
        }

        for (var field of [member, password]) {
            for (var type of ["keydown", "input", "change"]) {
                field.addEventListener(type, function (e) {
                    note(e.target.id + " " + e.type + (e.key ? " key=" + (e.key.length === 1 ? "char" : e.key) : "") +
                        (e.inputType !== undefined ? " inputType=" + (e.inputType || "''") : "") +
                        (e.target === member ? " length=" + member.value.length : ""));
                    if (e.target === password && e.type === "input")
                        sawPassword("input");
                    if (e.type !== "keydown")
                        setTimeout(function () { loginIfFilled(e.type); }, 150);
                });
            }
        }
        // The branch isn't filled by password managers; picking it after the fill also logs in
        branch.addEventListener("change", function () { loginIfFilled("branch"); });
        watch = setInterval(function () { loginIfFilled("timer"); }, 400);
        setTimeout(function () { clearInterval(watch); }, 10 * 60 * 1000);
        note("ready, branch " + (branch.value ? "set" : "empty"));
    }

    // Copy text to the clipboard, falling back to a hidden textarea where the Clipboard API is blocked
    async function copyText(text) {
        try {
            await navigator.clipboard.writeText(text);
            return true;
        } catch {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.select();
            const copied = document.execCommand("copy");
            document.body.removeChild(textArea);
            return copied;
        }
    }

    // Pull down from the top of a page to refresh it. The page's PullToRefresh component passes a .NET object
    // with a Refresh method; the indicator spins until that finishes. Returns a handle for beaconStopPullToRefresh.
    function beaconPullToRefresh(dotNet) {
        var threshold = 70, maxPull = 110;
        var indicator = document.createElement("div");
        indicator.className = "pull-indicator";
        indicator.innerHTML = '<span class="oi oi-reload" aria-hidden="true"></span>';
        document.body.appendChild(indicator);
        var startY = null, pull = 0, busy = false;

        function show(distance) {
            indicator.style.transform = "translate(-50%, " + (distance - 48) + "px) rotate(" + (distance * 3) + "deg)";
            indicator.style.opacity = Math.min(distance / threshold, 1);
            indicator.classList.toggle("ready", distance >= threshold);
        }
        function reset() {
            indicator.classList.remove("ready", "spinning");
            indicator.style.transition = "transform .2s, opacity .2s";
            show(0);
            setTimeout(function () { indicator.style.transition = ""; }, 200);
        }
        function onStart(e) {
            // Only from the very top, with one finger, and not while a menu or dialog is open
            if (busy || window.scrollY > 0 || e.touches.length !== 1 || document.querySelector(".more-menu, .modal.show"))
                return;
            startY = e.touches[0].clientY;
            pull = 0;
        }
        function onMove(e) {
            if (startY === null)
                return;
            var distance = e.touches[0].clientY - startY;
            if (distance <= 0 || window.scrollY > 0) {
                if (pull > 0) reset();
                startY = distance < 0 ? null : startY;
                pull = 0;
                return;
            }
            // Resist the pull the further it goes
            pull = Math.min(maxPull, distance * 0.5);
            show(pull);
            if (e.cancelable)
                e.preventDefault();
        }
        async function onEnd() {
            if (startY === null)
                return;
            startY = null;
            if (pull < threshold) {
                reset();
                return;
            }
            busy = true;
            indicator.classList.add("spinning");
            show(threshold);
            try {
                await dotNet.invokeMethodAsync("Refresh");
            } catch (e) {
                console.error(e);
            }
            busy = false;
            reset();
        }
        window.addEventListener("touchstart", onStart, { passive: true });
        window.addEventListener("touchmove", onMove, { passive: false });
        window.addEventListener("touchend", onEnd);
        window.addEventListener("touchcancel", onEnd);
        return {
            stop: function () {
                window.removeEventListener("touchstart", onStart);
                window.removeEventListener("touchmove", onMove);
                window.removeEventListener("touchend", onEnd);
                window.removeEventListener("touchcancel", onEnd);
                indicator.remove();
            }
        };
    }

    function beaconStopPullToRefresh(handle) {
        if (handle)
            handle.stop();
    }

</script>
