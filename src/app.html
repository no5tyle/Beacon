<!doctype html>
<html lang="en-AU">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover: the page fills the whole screen, and safe-area padding keeps content clear of notches -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-32.png" />
		<title>Beacon</title>
		<!-- The look Beacon shares with no5tyle's other apps; Beacon's own styles come after it -->
		<link rel="stylesheet" href="https://no5tyle.github.io/shared/no5tyle.css" />
		<script src="https://no5tyle.github.io/shared/app-switcher.js" defer></script>
		<script>
			// Opened from an iPhone's Home Screen: no browser bar, so no5tyle's bar is left out too
			if (navigator.standalone === true) document.documentElement.classList.add('installed');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
