<!doctype html>
<html lang="en-AU">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover: the page fills the whole screen, and safe-area padding keeps content clear of notches -->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#052767" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-32.png" />
		<title>Beacon</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
