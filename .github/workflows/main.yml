name: Deploy to GitHub Pages

# Run workflow on every push to the master branch
on:
  push:
    branches: [ main ]
  # Allow a deploy to be started manually from the Actions tab
  workflow_dispatch:

# The deploy step pushes the built site to the gh-pages branch
permissions:
  contents: write

jobs:
  deploy-to-github-pages:
    # use ubuntu-latest image to run steps on
    runs-on: ubuntu-latest
    steps:
    # uses GitHub's checkout action to checkout code form the master branch
    - name: Checkout main
      uses: actions/checkout@v2
    # Install .NET SDKs
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 10.0.x
    # Set the version shown in the app to the short hash of the commit being deployed, e.g. ddc53a8
    - name: Set version
      run: |
        VERSION=$(git rev-parse --short HEAD)
        echo "Version: $VERSION"
        sed -i "s@__VERSION__@$VERSION@g" ./Topo/Services/StorageService.cs
    # publishes Blazor project to the release-folder
    - name: Publish .NET Core Project
      run: dotnet publish ./Topo/Topo.csproj -c Release -o release --nologo
    # changes the base-tag in index.html from '/' to the repository's name to match the GitHub Pages subdirectory,
    # so the site keeps working if the repository is renamed
    - name: Change base-tag in index.html from / to the repository name
      run: sed -i 's@<base href="/" />@<base href="/${{ github.event.repository.name }}/" />@g' release/wwwroot/index.html
    # copy index.html to 404.html to serve the same file when a file is not found
    - name: copy index.html to 404.html
      run: cp release/wwwroot/index.html release/wwwroot/404.html
    # serve the installable Topo Reference app's start page as a real page rather than through 404.html
    - name: copy index.html to reference/index.html
      run: cp release/wwwroot/index.html release/wwwroot/reference/index.html
    # add .nojekyll file to tell GitHub pages to not treat this as a Jekyll project. (Allow files and folders starting with an underscore)
    - name: Add .nojekyll file
      run: touch release/wwwroot/.nojekyll

    - name: Commit wwwroot to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@3.7.1
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BRANCH: gh-pages
        FOLDER: release/wwwroot
